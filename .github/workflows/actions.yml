name: Rebuild

on:
  push:
    branches: [main, codex/linux-regeneration-audit]
  workflow_dispatch:
    inputs:
      audit_only:
        description: "Run the regeneration audit and checks without publishing"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  rebuild-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      # ── R setup ────────────────────────────────────────────────────────────
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true   # fast pre-built binaries

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('src/loaders/**/*.R') }}
          restore-keys: r-${{ runner.os }}-

      - name: Install sf system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('readxl', 'dplyr', 'tidyr', 'stringr',
                                         'yaml', 'openxlsx', 'jsonlite', 'sf', 'readr'),
                                        repos = 'https://cloud.r-project.org')"

      - name: Regenerate election data in isolation
        run: |
          scratch="$RUNNER_TEMP/geda-regenerated"
          mkdir -p "$scratch/src/data"
          cp -a src/data/{raw,results,turnout,candidates,config,shp} "$scratch/src/data/"
          mkdir -p "$scratch/src/loaders/R"
          cp -a src/loaders/R/common "$scratch/src/loaders/R/"
          cd "$scratch"
          for election in parl2012 parl2008 parl2016 parl2020 parl2024 local2017 local2014 local2010 local2021 local2025 \
                          adj2024 adj2020 adj2016 adj2008 pres2008 pres2013 pres2018 parl1919; do
            echo "::group::Regenerate $election"
            Rscript "$GITHUB_WORKSPACE/src/loaders/process_${election}.R"
            echo "::endgroup::"
          done

      # ── Node setup for download bundle scripts and Observable build ────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Check regenerated data against the checkout
        run: node scripts/compare-regenerated-data.js --check "$RUNNER_TEMP/geda-regenerated/src/data"

      - name: Check dashboard contracts
        run: |
          npm test
          Rscript scripts/test-districts.R
          Rscript scripts/test-ballot-results.R
          Rscript scripts/validate-canonical.R "${RUNNER_TEMP}/canonical-report"

      # ── Build download bundles (xlsx per election) ─────────────────────────
      - name: Build pres2008 download bundle
        run: node src/loaders/downloads/process_pres2008_download.js

      - name: Build pres2013 download bundle
        run: node src/loaders/downloads/process_pres2013_download.js

      - name: Build pres2018 download bundle
        run: node src/loaders/downloads/process_pres2018_download.js

      - name: Build pres2024_indirect download bundle
        run: node src/loaders/downloads/process_pres2024_indirect_download.js

      - name: Build parl1919 download bundle
        run: node src/loaders/downloads/process_parl1919_download.js

      - name: Build parl2008 download bundle
        run: node src/loaders/downloads/process_parl2008_download.js

      - name: Build parl2012 download bundle
        run: node src/loaders/downloads/process_parl2012_download.js

      - name: Build parl2016 download bundle
        run: node src/loaders/downloads/process_parl2016_download.js

      - name: Build parl2020 download bundle
        run: node src/loaders/downloads/process_parl2020_download.js

      - name: Build parl2024 download bundle
        run: node src/loaders/downloads/process_parl2024_download.js

      - name: Build local2025 download bundle
        run: node src/loaders/downloads/process_local2025_download.js

      - name: Build local2021 download bundle
        run: node src/loaders/downloads/process_local2021_download.js

      - name: Build local2017 download bundle
        run: node src/loaders/downloads/process_local2017_download.js

      - name: Build local2014 download bundle
        run: node src/loaders/downloads/process_local2014_download.js

      - name: Build local2010 download bundle
        run: node src/loaders/downloads/process_local2010_download.js

      - name: Build adj2024 download bundle
        run: node src/loaders/downloads/process_adj2024_download.js

      - name: Build adj2020 download bundle
        run: node src/loaders/downloads/process_adj2020_download.js

      - name: Build adj2016 download bundle
        run: node src/loaders/downloads/process_adj2016_download.js

      - name: Build adj2008 download bundle
        run: node src/loaders/downloads/process_adj2008_download.js

      - name: Update download metadata sheets
        run: node src/loaders/downloads/update_metadata.js

      # ── Node / Observable build ────────────────────────────────────────────
      - name: Build project
        run: npm run build

      - name: Copy manifest xlsx downloads to dist
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { collectDownloadEntries, OUT_DIR } from './src/loaders/downloads/shared.js';

          const entries = collectDownloadEntries();
          const outDir = 'dist/data/downloads';
          fs.mkdirSync(outDir, { recursive: true });

          for (const entry of entries) {
            const source = path.join(OUT_DIR, entry.filename);
            if (!fs.existsSync(source)) {
              throw new Error(`Download file listed in manifest is missing: ${source}`);
            }
            fs.copyFileSync(source, path.join(outDir, entry.filename));
          }
          console.log(`Copied ${entries.length} bundle(s) to ${outDir}`);
          NODE

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && !inputs.audit_only }}
        uses: actions/configure-pages@v3

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && !inputs.audit_only }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && !inputs.audit_only }}
        id: deployment
        uses: actions/deploy-pages@v4
